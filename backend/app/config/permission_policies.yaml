# FraudShield AI — Permission Policy Configuration
#
# This YAML file is the single configurable source of truth for the
# PermissionPolicyService. Each entry defines:
#   - expected_permissions: permissions that are NORMAL for this app category
#   - expected_behaviors:   runtime behaviors expected for this category
#   - suspicious_permissions: permissions that are ANOMALOUS for this category
#                             (raises the context_score)
#   - suspicious_behaviors:  dynamic behaviors that are ANOMALOUS
#
# Weights:
#   - Each suspicious_permission contributes its `weight` to the anomaly score.
#   - The anomaly score is normalised to [0, 1] before injection into the
#     ML scoring ensemble.
#
# Editing this file does NOT require a code deploy. The service reads it at
# startup and caches it for the process lifetime.

