# FraudShield AI — Render.com Blueprint
# Free tier only: backend API + frontend + postgres + redis (keyvalue)
# Workers (celery) run locally on Mac alongside the emulator.

databases:
  - name: fraudshield-db
    databaseName: fraudshield
    user: fraudshield
    plan: free

services:

  # ── Redis (Key-Value store) ──────────────────────────────────────────────
  - type: keyvalue
    name: fraudshield-redis
    plan: free
    ipAllowList: []

  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: fraudshield-backend
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fraudshield-redis
          type: keyvalue
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: STORAGE_BUCKET
        value: fraudshield-apks
      - key: STORAGE_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        value: us-east-005
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: CORS_ORIGINS
        value: "https://fraudshield-frontend.onrender.com,http://localhost:5173"
      - key: SANDBOX_MODE
        value: simulate
      - key: EXPLORE_APK
        value: "false"
      - key: MALWAREBAZAAR_ENABLED
        value: "false"

  # ── Frontend (Static Site) ───────────────────────────────────────────────
  - type: web
    name: fraudshield-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
