# FraudShield AI — Local Dynamic Worker
# ──────────────────────────────────────
# Run this on your Mac ALONGSIDE the Android Emulator.
# This worker picks dynamic analysis tasks from the REMOTE cloud RabbitMQ,
# runs the APK in your local emulator, and uploads results to cloud storage.
#
# Usage:
#   1. Copy .env.local-dynamic.example → .env.local-dynamic
#   2. Fill in the remote URLs from your Render / CloudAMQP / Backblaze dashboards
#   3. Make sure your emulator is running:
#        ~/Library/Android/sdk/emulator/emulator @Medium_Phone -dns-server 8.8.8.8
#   4. Start worker:
#        docker compose -f infra/docker-compose.local-dynamic.yml up

name: fraudshield-local-dynamic

services:
  worker-dynamic:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env.local-dynamic
    command: >
      celery -A app.workers.celery_app worker
      -Q dynamic_queue -l info --concurrency=1
    environment:
      SANDBOX_MODE: live
      SANDBOX_ADB_SERIAL: "emulator-5554"
      # Connect to the LOCAL ADB server (which sees your emulator)
      ADB_SERVER_SOCKET: "tcp:host.docker.internal:5037"
      ADB_BIN: adb
      SANDBOX_RUN_SECONDS: "${SANDBOX_RUN_SECONDS:-30}"
      EXPLORE_APK: "true"
    volumes:
      # Local temp storage for APK materialization (downloaded from cloud, deleted after analysis)
      - dynamic_tmp:/tmp/fraudshield-storage
      # ADB keypair so the container can auth with the emulator
      - ~/.android/adbkey:/home/appuser/.android/adbkey:ro
      - ~/.android/adbkey.pub:/home/appuser/.android/adbkey.pub:ro
    extra_hosts:
      # Allows container to reach host Mac's ADB server
      - "host.docker.internal:host-gateway"
    restart: on-failure
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G

volumes:
  dynamic_tmp:
