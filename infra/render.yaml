# FraudShield AI — Render.com Blueprint
# Deploy with: connect this repo in Render dashboard → it auto-reads this file.
# Repo root is the build context. All paths below are relative to repo root.
#
# Services deployed:
#   - fraudshield-backend   (FastAPI, web service)
#   - fraudshield-worker    (Celery static_queue, background worker)
#   - fraudshield-beat      (Celery beat scheduler, background worker)
#   - fraudshield-frontend  (Vite → Static Site)
#
# Managed infra:
#   - PostgreSQL (pgvector extension enabled via SQL migration)
#   - Redis

databases:
  - name: fraudshield-db
    databaseName: fraudshield
    user: fraudshield
    plan: free
    postgresMajorVersion: 15

redis:
  - name: fraudshield-redis
    plan: free
    maxmemoryPolicy: noeviction

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: fraudshield-backend
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Run migrations then start uvicorn
    startCommand: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: fraudshield-redis
          property: connectionString
      # RabbitMQ — set this manually from CloudAMQP dashboard
      - key: RABBITMQ_URL
        sync: false
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Object storage (Backblaze B2 / Cloudflare R2)
      - key: STORAGE_BUCKET
        value: fraudshield-apks
      - key: STORAGE_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        value: us-west-004
      # LLM Keys
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # CORS: allow the Render frontend URL + localhost dev
      # Update fraudshield-frontend.onrender.com after first deploy
      - key: CORS_ORIGINS
        value: "https://fraudshield-frontend.onrender.com,http://localhost:5173"
      - key: SANDBOX_MODE
        value: simulate
      - key: EXPLORE_APK
        value: "false"
      # Threat Intel
      - key: OTX_API_KEY
        sync: false
      - key: MALWAREBAZAAR_ENABLED
        value: "false"
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: FLOWER_USER
        value: admin
      - key: FLOWER_PASSWORD
        generateValue: true

  # ── Celery Static Queue Worker ─────────────────────────────────────────────
  - type: worker
    name: fraudshield-worker-static
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: >-
      celery -A app.workers.celery_app worker
      -Q static_queue -l info --concurrency=1
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: fraudshield-redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        fromService:
          name: fraudshield-backend
          type: web
          envVarKey: JWT_SECRET
      - key: STORAGE_BUCKET
        value: fraudshield-apks
      - key: STORAGE_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        value: us-west-004
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SANDBOX_MODE
        value: simulate
      - key: CORS_ORIGINS
        value: "https://fraudshield-frontend.onrender.com"

  # ── Celery Beat Scheduler ──────────────────────────────────────────────────
  - type: worker
    name: fraudshield-beat
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: celery -A app.workers.celery_app beat -l info
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: fraudshield-redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        fromService:
          name: fraudshield-backend
          type: web
          envVarKey: JWT_SECRET
      - key: STORAGE_BUCKET
        value: fraudshield-apks
      - key: STORAGE_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        value: us-west-004
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: CORS_ORIGINS
        value: "https://fraudshield-frontend.onrender.com"
      - key: SANDBOX_MODE
        value: simulate

  # ── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: static
    name: fraudshield-frontend
    buildCommand: cd frontend && npm ci && VITE_API_BASE_URL=$VITE_API_BASE_URL npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # After first deploy, paste your backend URL here:
      # e.g. https://fraudshield-backend.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
