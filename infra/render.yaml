# FraudShield AI — Render.com Blueprint
# Minimal, proven-working blueprint spec.
# Blueprint path: infra/render.yaml

databases:
  - name: fraudshield-db
    databaseName: fraudshield
    user: fraudshield
    plan: free

redis:
  - name: fraudshield-redis
    plan: free

services:

  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: fraudshield-backend
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: fraudshield-redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: STORAGE_BUCKET
        value: fraudshield-apks
      - key: STORAGE_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        value: us-east-005
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://fraudshield-frontend.onrender.com,http://localhost:5173"
      - key: SANDBOX_MODE
        value: simulate
      - key: EXPLORE_APK
        value: "false"
      - key: OTX_API_KEY
        sync: false
      - key: MALWAREBAZAAR_ENABLED
        value: "false"
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: FLOWER_USER
        value: admin
      - key: FLOWER_PASSWORD
        generateValue: true

  # ── Celery Static Queue Worker ───────────────────────────────────────────
  - type: worker
    name: fraudshield-worker-static
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: >-
      celery -A app.workers.celery_app worker
      -Q static_queue -l info --concurrency=1
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: fraudshield-redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_BUCKET
        value: fraudshield-apks
      - key: STORAGE_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        value: us-east-005
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: SANDBOX_MODE
        value: simulate
      - key: CORS_ORIGINS
        value: "https://fraudshield-frontend.onrender.com"

  # ── Celery Beat Scheduler ────────────────────────────────────────────────
  - type: worker
    name: fraudshield-beat
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: celery -A app.workers.celery_app beat -l info
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: fraudshield-redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_BUCKET
        value: fraudshield-apks
      - key: STORAGE_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        value: us-east-005
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: SANDBOX_MODE
        value: simulate
      - key: CORS_ORIGINS
        value: "https://fraudshield-frontend.onrender.com"

  # ── Frontend (Static Site) ───────────────────────────────────────────────
  - type: web
    name: fraudshield-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
