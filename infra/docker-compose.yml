# FraudShield AI — full stack Docker Compose
# Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up --build
#
# All services: Postgres, RabbitMQ, Redis, backend API, Celery workers, frontend (nginx)
name: fraudshield

# ── Shared env for every backend-derived service ────────────────────────────
x-backend-env: &backend-env
  ENVIRONMENT: development
  DEBUG: "true"
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  RABBITMQ_URL: ${RABBITMQ_URL}
  JWT_SECRET: ${JWT_SECRET}
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  STORAGE_BUCKET: fraudshield-apks
  STORAGE_REGION: us-east-005
  SANDBOX_MODE: live
  CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
  # LLM API keys — forwarded from .env
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
  
  # Dynamic Analysis Configuration
  EXPLORE_APK: ${EXPLORE_APK:-false}

x-backend-base: &backend-base
  build:
    context: ../backend
    dockerfile: Dockerfile
  env_file:
    - path: ../.env
      required: false
  volumes:
    - apk_storage:/tmp/fraudshield-storage
    - ../backend/app:/app/app
  restart: unless-stopped

services:
  # ── Infrastructure ──────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend_net
      - sandbox_net

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - backend_net
      - sandbox_net

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend_net
      - sandbox_net

  storage-init:
    image: busybox
    user: root
    command: sh -c "mkdir -p /tmp/fraudshield-storage/apks && chown -R 1000:1000 /tmp/fraudshield-storage"
    volumes:
      - apk_storage:/tmp/fraudshield-storage
    networks:
      - backend_net

  # ── Backend API ─────────────────────────────────────────────────────────
  backend:
    <<: *backend-base
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:    { condition: service_healthy }
      rabbitmq:    { condition: service_healthy }
      redis:       { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - backend_net

  # ── Celery: static analysis queue ───────────────────────────────────────
  worker-static:
    <<: *backend-base
    command: celery -A app.workers.celery_app worker -Q static_queue -l info --concurrency=2
    environment:
      <<: *backend-env
    healthcheck:
      disable: true
    depends_on:
      backend:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks:
      - backend_net

  # ── Celery: dynamic analysis queue ──────────────────────────────────────
  worker-dynamic:
    <<: *backend-base
    command: celery -A app.workers.celery_app worker -Q dynamic_queue -l info --concurrency=1
    environment:
      <<: *backend-env
      SANDBOX_MODE: live
      # Use Smart Socket Multiplexing to share the host ADB daemon
      SANDBOX_ADB_SERIAL: "emulator-5554"
      ADB_SERVER_SOCKET: "tcp:host.docker.internal:5037"
      ADB_BIN: adb
      # Respect the value set in .env (default was silently 60s because this
      # env block shadowed env_file for this specific variable).
      SANDBOX_RUN_SECONDS: "${SANDBOX_RUN_SECONDS:-15}"
    healthcheck:
      disable: true
    depends_on:
      backend:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - apk_storage:/tmp/fraudshield-storage
      - ~/.android/adbkey:/home/appuser/.android/adbkey:ro
      - ~/.android/adbkey.pub:/home/appuser/.android/adbkey.pub:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sandbox_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G

  # ── Celery Beat (scheduled tasks) ───────────────────────────────────────
  beat:
    <<: *backend-base
    command: celery -A app.workers.celery_app beat -l info
    environment:
      <<: *backend-env
    healthcheck:
      disable: true
    depends_on:
      backend: { condition: service_healthy }
    networks:
      - backend_net

  # ── Flower (Celery monitoring UI) ───────────────────────────────────────
  flower:
    <<: *backend-base
    command: celery -A app.workers.celery_app flower --port=5555 --basic-auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/')\""]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:5557:5555"
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks:
      - backend_net

  # ── Frontend (Vite → nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
    networks:
      - backend_net

networks:
  backend_net:
  sandbox_net:

volumes:
  pgdata:
  apk_storage:
