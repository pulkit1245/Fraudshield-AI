# FraudShield AI — full stack Docker Compose
# Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up --build
#
# All services: Postgres, RabbitMQ, Redis, backend API, Celery workers, frontend (nginx)
name: fraudshield

# ── Shared env for every backend-derived service ────────────────────────────
# NOTE: these are *overrides* layered on top of the repo-root .env (wired in via
# `env_file` on x-backend-base below). Anything listed here WINS over .env, so
# only put values here that must differ inside Compose (e.g. service hostnames).
# Never list a secret here with an empty default — `FOO: ${FOO:-}` resolves from
# your *shell*, not from .env, and an empty result silently shadows the real
# value in .env. That is exactly how VIRUSTOTAL_API_KEY became "".
x-backend-env: &backend-env
  ENVIRONMENT: development
  DEBUG: "true"
  DATABASE_URL: postgresql+psycopg2://fraudshield:fraudshield@postgres:5432/fraudshield
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  JWT_SECRET: 37368421e70e4df1568ee40de408600396abc02036349b17798766cdeaf150db
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  STORAGE_BUCKET: fraudshield-apks
  STORAGE_REGION: us-east-005
  SANDBOX_MODE: simulate
  CORS_ORIGINS: "http://localhost:5173"

x-backend-base: &backend-base
  build:
    context: ../backend
    dockerfile: Dockerfile
  # Secrets (VIRUSTOTAL_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, STORAGE_*) come
  # from here. Path is relative to this compose file, so ../.env == repo-root
  # .env. `required: false` keeps a fresh clone (no .env yet) bootable on the
  # pydantic defaults instead of hard-failing. Needs Compose >= 2.24.
  env_file:
    - path: ../.env
      required: false
  volumes:
    - apk_storage:/tmp/fraudshield-storage
  restart: unless-stopped

services:
  # ── Infrastructure ──────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: fraudshield
      POSTGRES_PASSWORD: fraudshield
      POSTGRES_DB: fraudshield
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudshield"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage-init:
    image: busybox
    user: root
    command: sh -c "mkdir -p /tmp/fraudshield-storage/apks && chown -R 1000:1000 /tmp/fraudshield-storage"
    volumes:
      - apk_storage:/tmp/fraudshield-storage

  # ── Backend API ─────────────────────────────────────────────────────────
  backend:
    <<: *backend-base
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:    { condition: service_healthy }
      rabbitmq:    { condition: service_healthy }
      redis:       { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── Celery: static analysis queue ───────────────────────────────────────
  worker-static:
    <<: *backend-base
    command: celery -A app.workers.celery_app worker -Q static_queue -l info --concurrency=2
    healthcheck:
      disable: true
    environment:
      <<: *backend-env
    depends_on:
      backend:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }

  # ── Celery: dynamic analysis queue ──────────────────────────────────────
  worker-dynamic:
    <<: *backend-base
    command: celery -A app.workers.celery_app worker -Q dynamic_queue -l info --concurrency=1
    healthcheck:
      disable: true
    environment:
      <<: *backend-env
      SANDBOX_MODE: simulate
      # Connect to the Android emulator running on the host Mac via ADB-over-TCP.
      # The emulator must be started on the host with: adb tcpip 5555
      SANDBOX_ADB_HOST: "host.docker.internal:5555"
      ADB_BIN: adb
    depends_on:
      backend:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }
    extra_hosts:
      - "host.docker.internal:host-gateway"


  # ── Celery Beat (scheduled tasks) ───────────────────────────────────────
  beat:
    <<: *backend-base
    command: celery -A app.workers.celery_app beat -l info
    healthcheck:
      disable: true
    environment:
      <<: *backend-env
    depends_on:
      backend: { condition: service_healthy }

  # ── Flower (Celery monitoring UI) ───────────────────────────────────────
  flower:
    <<: *backend-base
    command: celery -A app.workers.celery_app flower --port=5555
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/')\""]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      <<: *backend-env
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }

  # ── Frontend (Vite → nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  apk_storage:
